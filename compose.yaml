name: minori-placement-intelligence

services:
  backend:
    build:
      context: .
      target: backend
    environment:
      APP_NAME: ${APP_NAME:-MINORI Placement Intelligence}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: sqlite:////app/data/runtime/minori.db
      SQLITE_TIMEOUT_SECONDS: ${SQLITE_TIMEOUT_SECONDS:-5}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Jakarta}
      REMINDER_DELIVERY_TIME: ${REMINDER_DELIVERY_TIME:-09:00}
      NOTIFICATION_DRY_RUN: ${NOTIFICATION_DRY_RUN:-true}
      NOTIFICATION_LEASE_SECONDS: ${NOTIFICATION_LEASE_SECONDS:-120}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-3}
      NOTIFICATION_RETRY_BASE_SECONDS: ${NOTIFICATION_RETRY_BASE_SECONDS:-60}
      NOTIFICATION_RETRY_MAX_SECONDS: ${NOTIFICATION_RETRY_MAX_SECONDS:-3600}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      NINE_ROUTER_BASE_URL: ${NINE_ROUTER_DOCKER_BASE_URL:-}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      NINE_ROUTER_MODEL: ${NINE_ROUTER_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/app/data/runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    environment:
      BACKEND_BASE_URL: http://backend:8000
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-5}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.43.4}
    environment:
      DB_TYPE: sqlite
      DB_SQLITE_POOL_SIZE: 2
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run python scripts/bootstrap.py to create .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Bangkok}
      TZ: ${GENERIC_TIMEZONE:-Asia/Bangkok}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows/n8n:/workflows:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  backend_data:
  n8n_data:
